<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thenuja | Full Stack Dev</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div id="splash">
        <div class="boot-box">
            <h2 style="margin: 0 0 20px 0; font-size: 32px; border-bottom: 2px dashed var(--boot-text); padding-bottom: 10px; width: 100%; text-align: center;">
                SYSTEM_BOOT_V1.0
            </h2>
            
            <div id="boot-sequence"></div>
            
            <div class="splash-loader-container" id="loader-cont">
                <div class="splash-loader">
                    <div class="loader-bar" id="loader"></div>
                </div>
                <div class="splash-status" id="splash-text">LOADING CORE MODULES...</div>
            </div>

            <button id="btn-enter" onclick="startSystem()">[ CLICK TO START ]</button>
        </div>
    </div>

    <div class="bg-grid"></div>

    <main id="desktop">
        </main>

    <div id="start-menu">
        <div class="menu-item" onclick="wm.open('home'); wm.toggleStart()">🏠 HOME</div>
        <div class="menu-item" onclick="location.reload()">🔄 REBOOT</div>
        <div class="menu-item" onclick="alert('System Halted.')">🔴 POWER OFF</div>
    </div>

    <footer id="taskbar">
        <div class="start-btn" onclick="wm.toggleStart()">
            START
        </div>
        
        <div id="task-list"></div>

        <div class="tray">
            <button class="icon-btn" id="btn-bgm" title="Toggle Music">🎵</button>
            <button class="icon-btn" id="btn-sfx" title="Toggle SFX">🔊</button>
            <button class="icon-btn" id="btn-theme" title="Toggle Theme">☀/☾</button>
            <span id="clock" style="font-size: 24px;">00:00</span>
        </div>
    </footer>
    
</body>
</html>
